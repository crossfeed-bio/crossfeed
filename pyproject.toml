[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfeed"
version = "0.0.2"
description = "Build experimentally grounded microbial interaction networks from mGrowthDB data, in a neutral format that Syntropa, microbetag, and other tools can consume."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Syntropa" },
    { name = "KU Leuven, Lab of Molecular Bacteriology" },
]
keywords = ["microbial-interactions", "cross-feeding", "mGrowthDB", "metabolic-modeling", "open-science"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/crossfeed-bio/crossfeed"
Repository = "https://github.com/crossfeed-bio/crossfeed"

[project.scripts]
crossfeed = "crossfeed.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
