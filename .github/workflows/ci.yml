name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows and macOS too: a Windows-only failure (a test connecting to itself) was found by hand on #70
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: guardrail gate
        run: python checks/gate.py
      - name: release gate
        # with no tag it checks this tree's own version across pyproject.toml, the package, CITATION.cff
        # and r/DESCRIPTION, and the citation date against the changelog heading. It used to run only on
        # the tag, so a drift was found when the release was already being cut (#142 item 15)
        run: python packaging/check_release.py
      - name: tests
        run: pytest -q

  package:
    # the wheel and the source archive build, pass PyPI's checks, and a clean install serves the page (#27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      - name: install into a clean environment and open the page
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/grownet --help
          python packaging/smoke.py /tmp/clean/bin/grownet gui --no-browser
      - name: the source distribution carries what its own tests read
        # the sdist ships tests/, and it shipped without the schema, the fixtures and the page, so its
        # suite could not pass for anyone building from it (a distribution, conda-forge). The wheel is
        # what every other step installs, so nothing here caught it (found 2026-10-06).
        run: |
          python -m pip install pytest
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m pytest -q

  r-package:
    # the R companion package in r/, checked the way CRAN does (#112). R and its two dependencies come from
    # Ubuntu's own packages, so this adds no third-party action and nothing is compiled: r-cran-jsonlite is
    # what the package imports, r-cran-testthat is what runs its tests inside the check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install R, jsonlite and testthat
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite r-cran-testthat
          R --version | head -1
      - name: build and check the package
        # the suggested packages (miaSim) are not installed here: it is only named in examples that do not
        # run, so the check must not demand it
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          R CMD build r
          R CMD check --no-manual grownet_*.tar.gz
      - name: show the check log when it fails
        if: failure()
        run: cat grownet.Rcheck/00check.log || true

  windows-app:
    # the self-contained Windows program: a one-folder build in a zip (Karoline, on #63), built and started
    # on a Windows machine, so every change proves it still works (#26)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3 .
      - name: build the one-folder program and zip it
        run: python packaging/windows/build.py grownet-windows.zip
      - name: start it and open the page
        run: python packaging/smoke.py dist/grownet/grownet.exe --no-browser
      - name: run the command line from it, offline
        run: dist/grownet/grownet.exe derive SMGDB00000004 --fixture tests/fixtures/example_interactions.json --out example.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grownet-windows
          path: grownet-windows.zip
          retention-days: 14
