name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows and macOS too: a Windows-only failure (a test connecting to itself) was found by hand on #70
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: guardrail gate
        run: python checks/gate.py
      - name: tests
        run: pytest -q
