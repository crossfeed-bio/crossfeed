name: all-network

# Derives the All network of mGrowthDB once a day with the default settings and publishes it as the assets of
# one fixed release, `all-network`, replacing the previous day's (#96). The page's All button and
# `grownet derive --all` read it when it is less than 36 hours old and the settings are the defaults, and derive
# live otherwise. Release assets are not in git, so no data enters the repository. Scheduled runs use the
# default branch only; "Run workflow" on the Actions tab starts one by hand.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if this run has less than half the arcs of the artifact it replaces"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: all-network
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write        # to say so when a daily build fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install .
      - name: derive All
        id: derive
        env:
          # empty on a scheduled run, so the floor in publish_all.py applies (#236)
          ALLOW_DROP: ${{ inputs.allow_drop }}
        run: python packaging/publish_all.py out notes.md
      - name: publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The description is set on EVERY run from notes.md, which publish_all.py writes from what the run
        # produced. It used to be the `--notes` of `gh release create` behind `||`, so it was written once,
        # on 2026-09-29, and editing it here changed nothing on the release (#236). notes.md is outside
        # out/, so it is not uploaded as an asset.
        run: |
          gh release view all-network >/dev/null 2>&1 || gh release create all-network --prerelease \
            --latest=false --title "All network, derived once a day" --notes-file notes.md
          gh release upload all-network out/* --clobber
      - name: describe what was published
        id: describe
        # its own step, after the upload, so a failure here cannot make the build-failure issue below say
        # "did not publish" about assets that were already replaced (found in review)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit all-network --notes-file notes.md
      - name: say when the description could not be set
        # the assets are new and the description is the previous run's, which says it describes "the
        # files below as they are now": that is worth an issue of its own (found in review)
        if: always() && steps.describe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create all-network-description-stale --color FBCA04 --force \
            --description "The daily All network was published and its release description could not be updated"
          open=$(gh issue list --label all-network-description-stale --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Again: $RUN"
          else
            gh issue create --label all-network-description-stale --title "The daily All network's description is stale" --body "The run $RUN published new assets and could not update the release description, so the description is the previous run's. This issue closes itself when a run updates it."
          fi
      - name: close the description issue once a run updates it
        if: always() && steps.describe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label all-network-description-stale --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Described again: $RUN"
          done
      - name: check the properties of what was derived from the live corpus
        id: live
        # whenever the files went out, whatever happened to the description after them
        if: always() && steps.publish.outcome == 'success'
        # The only check in the project that reads a real mGrowthDB response (#237). It runs AFTER the
        # publish, on the file just written, so it adds no derivation of All and does not block one:
        # a violation is the code's, and every copy derives the same thing live. One study is derived in
        # gLV mode besides, which the daily file does not exercise. A violation opens its own issue.
        run: python packaging/live_check.py out
      - name: say when a property of the live derivation fails
        if: failure() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.live.outputs.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-check-failed --color D93F0B --force \
            --description "The live check of what grownet derives failed: a broken property or a run that could not check"
          open=$(gh issue list --label live-check-failed --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again ($OUTCOME): $RUN"
          else
            if [ "$OUTCOME" = "violation" ]; then
              what="found arcs that break a property the tool promises (the log of that step names each one)"
            else
              what="could not run (an mGrowthDB outage or a crash in the check; the log says which), so it says nothing about the properties"
            fi
            gh issue create --label live-check-failed --title "The live check of the derivation failed" --body "The run $RUN derived from the live mGrowthDB and \`packaging/live_check.py\` $what. The All network was published as derived. This issue closes itself when the check passes."
          fi
      - name: close the live-check issue once the check passes
        if: always() && steps.live.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label live-check-failed --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Every property holds again: $RUN"
          done
      - name: say so when the build fails
        # a failed day leaves the files to age past what each copy accepts (36 hours for this version, a day
        # for 0.3.x and 0.4.x), and every copy of grownet then derives All live
        # from mGrowthDB at once, so a failure opens an issue (Craig's agent, #96). Not for the live check,
        # which runs after a successful publish and has its own issue above.
        if: failure() && steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create all-network-failed --color B60205 --force \
            --description "The daily All network could not be derived or published"
          open=$(gh issue list --label all-network-failed --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN"
          else
            gh issue create --label all-network-failed --title "The daily All network failed" --body "The run $RUN did not publish the All network. Until a run succeeds, the published files age past what each installed copy accepts (36 hours for the current version, a day for 0.3.x and 0.4.x) and every copy of grownet derives All live from mGrowthDB. This issue closes itself when a run succeeds."
          fi
      - name: close the failure issue once a build succeeds
        if: always() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label all-network-failed --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Published again: $RUN"
          done
